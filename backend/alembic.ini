# Alembic configuration, SPEC.md Section 5.
#
# There is deliberately no sqlalchemy.url here. The connection string is read
# from DATABASE_URL through app/config.py (see alembic/env.py), so a migration
# cannot be run against a different database than the application uses, and no
# credential is ever written into a committed config file (AGENTS.md).
#
# Usage, from the backend/ directory with the virtual environment active:
#
#     alembic upgrade head            # build or update the schema
#     alembic downgrade base          # tear it back down
#     alembic revision -m "message"   # new empty revision
#     alembic current                 # what the database is at

[alembic]
script_location = alembic
prepend_sys_path = .

# Required alongside prepend_sys_path. Without it Alembic falls back to splitting
# that value on spaces, commas, and colons, which breaks on Windows the moment a
# path contains a drive letter, and warns on every invocation.
path_separator = os

# Revision filenames are date-prefixed rather than bare hashes, so
# `ls alembic/versions` reads in authoring order. The revision id in the file is
# still what Alembic orders by; this only affects readability.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timestamps in generated revisions use UTC, so a migration authored in one
# timezone does not appear to precede one authored earlier elsewhere.
timezone = UTC

[post_write_hooks]
# Generated revisions are formatted and linted by the same tools CI enforces on
# everything else, so a freshly generated file does not fail the lint job.
hooks = black,flake8
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME
flake8.type = console_scripts
flake8.entrypoint = flake8
flake8.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
