[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
    venv
  | \.venv
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the backend directory on sys.path so `import app` resolves without
# installing the package or setting PYTHONPATH in every environment.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
# Warnings are errors, so a deprecation in our own code surfaces at the commit
# that introduces it rather than at the version bump that removes the feature.
# Exemptions below are for warnings raised inside third-party code that we
# cannot fix from here. Keep each one narrow and explain it, an over-broad
# ignore defeats the point of the "error" default. Re-check these on any
# dependency bump; they should be removable, not permanent.
filterwarnings = [
    "error",
    # starlette 1.6.0's test client imports the deprecated
    # `anyio.abc.BlockingPortal` alias at module import time. Triggered by
    # starlette itself, not by app code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # langgraph checkpoint serde pending default change; third-party import.
    "ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    # ddtrace 2.4.0 installs a ModuleWatchdog whose chained loader lacks
    # exec_module; under pytest's assertion-rewrite import hook CPython emits
    # this ImportWarning while importing langgraph. Raised inside ddtrace and
    # importlib, not app code, and unfixable from here.
    "ignore:_ImportHookChainedLoader.exec_module:ImportWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "venv/*",
    ".venv/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 70% floor per AGENTS.md and SPEC.md Section 4. Enforced in CI via
# --cov-fail-under=70 as well, so the gate applies even if this file is
# bypassed by a direct pytest invocation with different arguments.
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
