name: CI

# The two job IDs below, `lint-test` and `build`, are the exact strings
# configured as required status checks on the protected `main` branch. GitHub
# derives a check's context from the job's display name, so adding a `name:`
# key to either job (for example `name: Lint and test`) would change the
# reported context and the branch protection rule would wait forever on a check
# that no longer reports. Rename these only alongside the corresponding
# `gh api repos/:owner/:repo/branches/main/protection` update.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege. Neither job writes to the repository, publishes a package,
# or comments on a pull request.
permissions:
  contents: read

# A new push to the same branch cancels the previous run, so a stale run does
# not hold a required check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with backend/Dockerfile's base image. A mismatch means CI
  # tests one interpreter and the shipped image runs another.
  PYTHON_VERSION: "3.13"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The data model's tests run against a real Postgres, not SQLite and not a
    # mock. They have to: the guarantees under test are a plpgsql trigger
    # rejecting UPDATE and DELETE, a partial unique index, NULLS NOT DISTINCT,
    # and CHECK constraints, none of which SQLite has. A stand-in would let all
    # of them pass while the real database enforced nothing.
    #
    # Version pinned to match infra/docker-compose.yml. NULLS NOT DISTINCT needs
    # Postgres 15 or newer, so a silent downgrade here would fail the audit log's
    # fork-prevention test rather than warn.
    services:
      postgres:
        # Must match infra/docker-compose.yml: rag_chunks migration needs the
        # `vector` extension (CREATE EXTENSION vector). Plain postgres:17-alpine
        # does not ship it; CI then fails every DB test at alembic upgrade.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: qaegis_test
          POSTGRES_USER: qaegis
          # CI-only, ephemeral, and reachable solely from this job's containers.
          # Not a secret in any meaningful sense; a GitHub secret here would
          # imply otherwise while protecting nothing.
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        # Without this the first migration races the database's startup and the
        # job fails intermittently on connection refused.
        options: >-
          --health-cmd "pg_isready -U qaegis -d qaegis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The test suite runs `alembic upgrade head` itself, so the schema under
      # test is built by the same migration a developer runs, not by
      # create_all(). A migration that works against the models but not against
      # an empty database would fail here rather than in someone's local setup.
      DATABASE_URL: postgresql+psycopg://qaegis:ci-throwaway@127.0.0.1:5432/qaegis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Determinism gate for SPEC.md 3.6. opa eval does not honour
      # capabilities.json; opa check does. Pin matches the WASM compile.
      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.8.0

      - name: Check policy (capabilities)
        run: opa check --capabilities app/policy/rego/capabilities.json app/policy/rego/policy.rego

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Formatting and linting run before the tests, and each is its own step,
      # so a failure names the tool that failed instead of surfacing as one
      # opaque red job.
      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 .

      # The 70% floor is a gate, not a report: --cov-fail-under makes the job
      # fail below it. See AGENTS.md, coverage is enforced, not advisory.
      - name: Test with coverage gate
        run: pytest --cov=app --cov-fail-under=70

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag q-aegis-backend:ci backend

      # A build that produces an image which cannot serve a request is not a
      # passing build. This starts the image and polls the real health endpoint,
      # which also verifies the unprivileged user in the Dockerfile can bind
      # and serve.
      - name: Smoke-test the image
        run: |
          docker run --detach --name qaegis-ci \
            --publish 127.0.0.1:8000:8000 q-aegis-backend:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
                 http://127.0.0.1:8000/api/v1/health; then
              echo "health endpoint responded after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::health endpoint did not respond within 30s"
          docker logs qaegis-ci
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs qaegis-ci || true

      - name: Clean up
        if: always()
        run: docker rm --force qaegis-ci || true

  # ---------------------------------------------------------------------------
  # Frontend: lint, test, build.
  #
  # NEW JOB — not wired into branch protection yet. Call it out for Abhinav so
  # he can add it as a required check once it has been green for a few runs.
  # The existing lint-test and build jobs above are untouched; their IDs are
  # what branch protection references.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The 70% floor is enforced by vitest.config.ts coverage thresholds
      - name: Test with coverage gate
        run: npm test

      - name: Build
        run: npm run build
