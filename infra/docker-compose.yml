# Local development stack for Q-AEGIS Shield: Postgres, Redis, Neo4j, API.
#
# Run from this directory:
#
#     # First time (or after rotating certs): generate infra/certs/
#     #   PowerShell: ..\scripts\generate-local-certs.ps1
#     #   bash:       ../scripts/generate-local-certs.sh
#
#     docker compose --env-file ../.env up -d
#     docker compose --env-file ../.env ps
#     docker compose --env-file ../.env down
#
# Copy ../.env.example to ../.env and fill in local values first.
# Generate TLS material before bringing the stack up; certs are gitignored.
#
# Credentials reach most containers via `env_file: ../.env`. The backend
# service also needs `--env-file ../.env` so compose can rewrite DATABASE_URL /
# REDIS_URL to in-network hostnames with TLS query params. Datastore-only
# workflows can still use `docker compose up` without interpolation.
#
# Ports are hardcoded to loopback. Edit them directly if one collides.
#
# Tradeoff accepted for local development: `env_file` hands each container the
# entire .env. Acceptable because these are throwaway local values (PRD NG4).
#
# Neo4j Bolt TLS is still plaintext on loopback this pass (certificate policy
# wiring is deferred). Postgres, Redis, and the API terminate TLS with the
# shared local CA under infra/certs/.

name: q-aegis-shield

services:
  postgres:
    image: postgres:17-alpine
    container_name: qaegis-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - ssl_ca_file=/certs/ca.crt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: qaegis-redis
    restart: unless-stopped
    env_file:
      - ../.env
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --tls-port 6379
        --port 0
        --tls-cert-file /certs/server.crt
        --tls-key-file /certs/server.key
        --tls-ca-cert-file /certs/ca.crt
        --tls-dh-params-file /certs/redis.dh
        --tls-auth-clients no
        --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is not set in .env}"
        --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/redis.dh:/certs/redis.dh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$${REDIS_PASSWORD}"
          redis-cli --tls --cert /certs/server.crt --key /certs/server.key
          --cacert /certs/ca.crt ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  neo4j:
    image: neo4j:5-community
    container_name: qaegis-neo4j
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - NEO4J_USERNAME=neo4j NEO4J_PASSWORD="$${QAEGIS_NEO4J_PASSWORD}" cypher-shell "RETURN 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../backend
    container_name: qaegis-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # In-network hosts + TLS. Credentials must match ../.env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=require
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_DEV_HEADER_BYPASS: "true"
      DOCUMENT_STORAGE_DIR: /data/documents
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - backend-documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8443"
      - --ssl-certfile
      - /certs/server.crt
      - --ssl-keyfile
      - /certs/server.key
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import ssl,urllib.request,sys;
          ctx=ssl.create_default_context();
          ctx.check_hostname=False;
          ctx.verify_mode=ssl.CERT_NONE;
          sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8443/api/v1/health',
          context=ctx,timeout=4).status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  backend-documents:
