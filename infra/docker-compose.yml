# Local development stack for Q-AEGIS Shield: Postgres, Redis, Neo4j, API.
#
# Run from this directory:
#
#     # First time (or after rotating certs): generate infra/certs/
#     #   PowerShell: ..\scripts\generate-local-certs.ps1
#     #   bash:       ../scripts/generate-local-certs.sh
#
#     docker compose --env-file ../.env up -d
#     docker compose --env-file ../.env ps
#     docker compose --env-file ../.env down
#
# Copy ../.env.example to ../.env and fill in local values first.
# Generate TLS material before bringing the stack up; certs are gitignored.
#
# Credentials reach most containers via `env_file: ../.env`. The backend
# service also needs `--env-file ../.env` so compose can rewrite DATABASE_URL /
# REDIS_URL to in-network hostnames with TLS query params. Datastore-only
# workflows can still use `docker compose up` without interpolation.
#
# Ports are hardcoded to loopback. Edit them directly if one collides.
#
# Tradeoff accepted for local development: `env_file` hands each container the
# entire .env. Acceptable because these are throwaway local values (PRD NG4).
#
# Local TLS: Postgres, Redis, API HTTPS, and Neo4j Bolt all terminate TLS with
# the shared CA under infra/certs/ (scripts/generate-local-certs.*). Neo4j
# values in .env stay QAEGIS_-prefixed — the neo4j image maps NEO4J_* to
# server config and crash-loops on unknown names.

name: q-aegis-shield

services:
  postgres:
    # Relational store + pgvector for FR-11 RAG chunks (SPEC.md 3.12).
    # Image ships the `vector` extension; decided in docs/decisions.md.
    image: pgvector/pgvector:pg17
    container_name: qaegis-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    # Windows bind mounts often present keys as mode 0777; Postgres refuses that.
    # Copy into the container filesystem, chmod 0600, then start.
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /var/lib/postgresql/certs
        && cp /certs-ro/server.crt /certs-ro/server.key /certs-ro/ca.crt
        /var/lib/postgresql/certs/
        && chown postgres:postgres /var/lib/postgresql/certs/*
        && chmod 600 /var/lib/postgresql/certs/server.key
        && chmod 644 /var/lib/postgresql/certs/server.crt
        /var/lib/postgresql/certs/ca.crt
        && exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
        -c ssl_key_file=/var/lib/postgresql/certs/server.key
        -c ssl_ca_file=/var/lib/postgresql/certs/ca.crt
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./certs/server.crt:/certs-ro/server.crt:ro
      - ./certs/server.key:/certs-ro/server.key:ro
      - ./certs/ca.crt:/certs-ro/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: qaegis-redis
    restart: unless-stopped
    env_file:
      - ../.env
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --tls-port 6379
        --port 0
        --tls-cert-file /certs/server.crt
        --tls-key-file /certs/server.key
        --tls-ca-cert-file /certs/ca.crt
        --tls-dh-params-file /certs/redis.dh
        --tls-auth-clients no
        --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is not set in .env}"
        --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/redis.dh:/certs/redis.dh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$${REDIS_PASSWORD}"
          redis-cli --tls --cert /certs/server.crt --key /certs/server.key
          --cacert /certs/ca.crt ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  neo4j:
    # Knowledge graph, SPEC.md 3.11. Bolt TLS required (AGENTS.md). Host bind
    # mounts on Windows are often world-readable; Neo4j rejects that for
    # private.key, so we copy from /certs-ro and chmod inside the container.
    image: neo4j:5-community
    container_name: qaegis-neo4j
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_default__advertised__address: localhost
      NEO4J_server_bolt_tls__level: REQUIRED
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: /var/lib/neo4j/certificates/bolt
      NEO4J_dbms_ssl_policy_bolt_private__key: private.key
      NEO4J_dbms_ssl_policy_bolt_public__certificate: public.crt
      NEO4J_dbms_ssl_policy_bolt_client__auth: NONE
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        mkdir -p /var/lib/neo4j/certificates/bolt/trusted
        cp /certs-ro/server.key /var/lib/neo4j/certificates/bolt/private.key
        cp /certs-ro/server.crt /var/lib/neo4j/certificates/bolt/public.crt
        cp /certs-ro/ca.crt /var/lib/neo4j/certificates/bolt/trusted/ca.crt
        chown -R neo4j:neo4j /var/lib/neo4j/certificates
        chmod 400 /var/lib/neo4j/certificates/bolt/private.key
        chmod 644 /var/lib/neo4j/certificates/bolt/public.crt
        chmod 644 /var/lib/neo4j/certificates/bolt/trusted/ca.crt
        exec tini -g -- /startup/docker-entrypoint.sh neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./certs/server.key:/certs-ro/server.key:ro
      - ./certs/server.crt:/certs-ro/server.crt:ro
      - ./certs/ca.crt:/certs-ro/ca.crt:ro
    healthcheck:
      # bolt+ssc trusts the local self-signed cert without a custom Java
      # truststore. Application clients should use bolt+s:// + CA file.
      test:
        - CMD-SHELL
        - >-
          NEO4J_USERNAME=neo4j NEO4J_PASSWORD="$${QAEGIS_NEO4J_PASSWORD}"
          cypher-shell -a bolt+ssc://localhost:7687 "RETURN 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  backend:
    build:
      context: ../backend
    container_name: qaegis-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # In-network hosts + TLS. Credentials must match ../.env.
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=verify-ca&sslrootcert=/certs/ca.crt"
      REDIS_URL: "rediss://:${REDIS_PASSWORD}@redis:6379/0"
      REDIS_SSL_CA_CERTS: /certs/ca.crt
      # Neo4j over Bolt TLS, in-network host. Overrides the host-oriented values
      # in ../.env (which target 127.0.0.1 and a relative CA path for host-run
      # tooling). The CA path is the container mount, not the host path.
      QAEGIS_NEO4J_URI: "bolt+s://neo4j:7687"
      QAEGIS_NEO4J_SSL_CA_CERTS: /certs/ca.crt
      # Public root CA bundle for outbound TLS. NOT the local /certs/ca.crt:
      # scoping the whole process trust store to the private CA breaks any
      # public-issuer TLS the app initiates. Datastores pin the local CA per
      # connection (see REDIS_SSL_CA_CERTS / sslrootcert / QAEGIS_NEO4J_SSL_CA_CERTS),
      # so they are unaffected. This overrides the host path in ../.env.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      AUTH_DEV_HEADER_BYPASS: "true"
      DOCUMENT_STORAGE_DIR: /data/documents
      # Trained sensitivity classifier (FR-1). The image bakes the bundle at this
      # path; set it explicitly so it wins over any CLASSIFIER_MODEL_PATH inherited
      # from ../.env (an empty value there must not mask the baked model).
      CLASSIFIER_MODEL_PATH: /srv/artifacts/classifier/multigenre-hashing-svm-1.0.0.joblib
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set in .env}
      QAEGIS_DEV_SEED_PASSWORD: ${QAEGIS_DEV_SEED_PASSWORD:?QAEGIS_DEV_SEED_PASSWORD is not set in .env}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - backend-documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8443"
      - --ssl-certfile
      - /certs/server.crt
      - --ssl-keyfile
      - /certs/server.key
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import ssl,urllib.request,sys;
          ctx=ssl.create_default_context();
          ctx.check_hostname=False;
          ctx.verify_mode=ssl.CERT_NONE;
          sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8443/api/v1/health',
          context=ctx,timeout=4).status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  backend-documents:
