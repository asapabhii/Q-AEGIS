<svg width="600" height="800" viewBox="0 -50 600 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B8FF"/>
      <stop offset="100%" stop-color="#7A2FE0"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A2FE0"/>
      <stop offset="100%" stop-color="#E6D4FF"/>
    </linearGradient>
    <radialGradient id="shieldFill" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#241046"/>
      <stop offset="100%" stop-color="#0D0620"/>
    </radialGradient>
  </defs>

  <!-- Shield body -->
  <path d="M300,40 L520,140 C520,430 430,600 300,660 C170,600 80,430 80,140 Z"
        fill="url(#shieldFill)" stroke="url(#edgeGrad)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Inner circuit-edge accent line, offset inside shield -->
  <path d="M300,66 L495,152 C495,420 412,578 300,633 C188,578 105,420 105,152 Z"
        fill="none" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Q ring -->
  <circle cx="300" cy="320" r="110" fill="none" stroke="url(#markGrad)" stroke-width="16"/>

  <!-- Q tail -->
  <path d="M368,388 L458,478" stroke="url(#markGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="458" cy="478" r="19" fill="#E6D4FF"/>

  <!-- Quantum orbits (qubit motif) -->
  <g fill="none" stroke="url(#markGrad)" stroke-width="5" opacity="0.9">
    <ellipse cx="300" cy="320" rx="72" ry="30" transform="rotate(0 300 320)"/>
    <ellipse cx="300" cy="320" rx="72" ry="30" transform="rotate(60 300 320)"/>
    <ellipse cx="300" cy="320" rx="72" ry="30" transform="rotate(120 300 320)"/>
  </g>
  <circle cx="372" cy="320" r="5" fill="#F5ECFF" transform="rotate(0 300 320)"/>
  <circle cx="372" cy="320" r="5" fill="#F5ECFF" transform="rotate(60 300 320)"/>
  <circle cx="372" cy="320" r="5" fill="#F5ECFF" transform="rotate(120 300 320)"/>

  <!-- Padlock (security core) -->
  <path d="M288,318 v-12 a12,12 0 0 1 24,0 v12" fill="none" stroke="url(#markGrad)"
        stroke-width="9" stroke-linecap="round"/>
  <rect x="277" y="318" width="46" height="34" rx="8" fill="#F5ECFF"/>
  <circle cx="300" cy="330" r="5" fill="#1B0E3D"/>
  <rect x="297" y="333" width="6" height="12" rx="2" fill="#1B0E3D"/>
</svg>
